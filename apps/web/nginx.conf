server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — serve index.html for all non-asset routes
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to Render backend
  location /api/ {
    proxy_pass https://suryakavach-api.onrender.com/api/;
    proxy_set_header Host suryakavach-api.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy WebSocket to Render backend
  location /ws/ {
    proxy_pass https://suryakavach-api.onrender.com/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host suryakavach-api.onrender.com;
    proxy_read_timeout 86400;
  }

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
