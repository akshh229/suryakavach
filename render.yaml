services:
  - type: web
    name: suryakavach-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: USE_SUPABASE
        value: "1"
      - key: SURYAKAVACH_CONFIG
        value: /app/config.yaml
      - key: SURYAKAVACH_DATA
        value: /data
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    healthCheckPath: /api/health
